name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sudoku_2077
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sudoku_2077?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sudoku_2077?schema=public
      JWT_ACCESS_SECRET: test-secret-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run --workspace apps/api prisma:generate
      - run: npm exec --workspace apps/api -- prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
